<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>暗夜幸存者</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: none; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 10; }
  .hidden { display: none !important; }

  /* 顶部 HUD */
  #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none; padding: env(safe-area-inset-top) 0 0 0; }
  #hud-top { display: flex; justify-content: center; gap: 18px; padding: 10px 14px 0; font-size: 13px; color: #cfd0e0; text-shadow: 0 1px 3px #000; }
  #hud-top b { color: #fff; font-size: 15px; }
  #timer { font-variant-numeric: tabular-nums; }
  .bar-wrap { position: relative; margin: 6px 14px 0; height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; overflow: hidden; }
  .bar { position: absolute; inset: 0; width: 100%; transform-origin: left; transition: transform .12s linear; }
  #hp-bar { background: linear-gradient(90deg,#e8434a,#ff7a5c); }
  #exp-bar { background: linear-gradient(90deg,#3aa0ff,#7be0ff); }
  .bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; letter-spacing: .5px; }
  #exp-wrap { height: 8px; margin-top: 4px; }
  #level-badge { position: absolute; left: 14px; top: 40px; font-size: 11px; color: #7be0ff; }

  /* 武器/被动图标栏 */
  #skills { position: absolute; left: 10px; top: 92px; z-index: 5; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  .skill-chip { display: flex; align-items: center; gap: 4px; background: rgba(10,12,24,.7); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 3px 6px 3px 4px; }
  .skill-chip .ic { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .skill-chip .lv { font-size: 10px; color: #ffd76a; font-weight: bold; }

  /* 按钮通用 */
  .btn { appearance: none; border: none; cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 600; color: #fff; padding: 13px 34px; border-radius: 12px; background: linear-gradient(180deg,#5b8cff,#3457d5); box-shadow: 0 6px 18px rgba(52,87,213,.45); transition: transform .08s, filter .15s; }
  .btn:active { transform: translateY(2px) scale(.98); filter: brightness(1.1); }
  .btn.ghost { background: rgba(255,255,255,.1); box-shadow: none; border: 1px solid rgba(255,255,255,.25); }

  /* 面板 */
  .panel { background: linear-gradient(160deg,rgba(24,26,44,.97),rgba(14,15,28,.97)); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 30px 28px; width: min(90vw,430px); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .title { font-size: 34px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(90deg,#ff6a6a,#ffd76a,#6affc0); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #9a9cb5; margin-bottom: 22px; line-height: 1.7; }
  .big-num { font-size: 30px; color: #ffd76a; font-weight: 800; margin: 6px 0; }

  /* 升级选择 */
  #levelup-panel { width: min(94vw,560px); }
  #levelup-panel .title { font-size: 24px; background: linear-gradient(90deg,#7be0ff,#a78bfa); -webkit-background-clip: text; background-clip: text; }
  .cards { display: flex; gap: 10px; margin-top: 18px; justify-content: center; flex-wrap: wrap; }
  .card { flex: 1 1 150px; max-width: 170px; min-width: 130px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 16px 10px; cursor: pointer; transition: transform .12s, border-color .12s, background .12s; }
  .card:active { transform: scale(.96); }
  .card:hover { border-color: #7be0ff; background: rgba(123,224,255,.1); }
  .card .ic { width: 48px; height: 48px; margin: 0 auto 10px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .card .nm { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 5px; }
  .card .ds { font-size: 11px; color: #a8aabd; line-height: 1.5; min-height: 46px; }
  .card .lvtag { font-size: 10px; color: #ffd76a; margin-top: 6px; }

  /* 暂停按钮 */
  #pause-btn { position: absolute; right: 14px; top: 40px; z-index: 6; width: 38px; height: 38px; border-radius: 10px; background: rgba(10,12,24,.7); border: 1px solid rgba(255,255,255,.22); color: #fff; font-size: 16px; cursor: pointer; }

  /* 虚拟摇杆 */
  #joystick { position: absolute; z-index: 6; left: 0; bottom: 0; width: 100%; height: 45%; pointer-events: none; }
  #joy-base { position: absolute; width: 108px; height: 108px; border-radius: 50%; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.25); opacity: 0; transition: opacity .15s; }
  #joy-knob { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(123,224,255,.55); border: 2px solid rgba(255,255,255,.5); opacity: 0; transition: opacity .15s; }

  .hint { font-size: 11px; color: #7d7f96; margin-top: 14px; line-height: 1.7; }
  .row { display: flex; gap: 10px;justify-content:center; margin-top: 16px; flex-wrap: wrap; }
  #toast { position: absolute; top: 22%; left: 0; right: 0; text-align: center; z-index: 8; pointer-events: none; }
  #toast span { display: inline-block; background: rgba(0,0,0,.6); color: #ffd76a; font-size: 20px; font-weight: 700; padding: 8px 20px; border-radius: 20px; opacity: 0; transition: opacity .3s, transform .3s; transform: translateY(10px); }
  #toast span.show { opacity: 1; transform: translateY(0); }
  .mute { position:absolute; right:14px; top:86px; z-index:6; width:38px;height:38px;border-radius:10px;background:rgba(10,12,24,.7);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:16px;cursor:pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hud-top"><span>⏱ <b id="timer">00:00</b></span><span>💀 <b id="kills">0</b></span><span>⭐ <b id="level">1</b></span></div>
  <div class="bar-wrap"><div class="bar" id="hp-bar"></div><div class="bar-label" id="hp-label">100 / 100</div></div>
  <div class="bar-wrap" id="exp-wrap"><div class="bar" id="exp-bar"></div></div>
  <div id="level-badge">LV.1</div>
</div>
<button id="pause-btn" class="hidden">⏸</button>
<button id="mute-btn" class="mute hidden">🔊</button>
<div id="skills"></div>

<div id="joystick" class="hidden">
  <div id="joy-base"></div><div id="joy-knob"></div>
</div>

<div id="toast"><span></span></div>

<!-- 主菜单 -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="title">暗夜幸存者</div>
    <div class="subtitle">在无尽的怪物潮中活下去<br>自动攻击 · 走位躲避 · 升级变强</div>
    <button class="btn" id="start-btn">开始游戏</button>
    <div class="row"><button class="btn ghost" id="how-btn" style="font-size:13px;padding:9px 18px;">玩法说明</button></div>
    <div class="hint">最高存活：<b id="best-time" style="color:#ffd76a">00:00</b> ｜ 最高击杀：<b id="best-kills" style="color:#ffd76a">0</b></div>
  </div>
</div>

<!-- 玩法说明 -->
<div id="how" class="overlay hidden">
  <div class="panel">
    <div class="title" style="font-size:24px;background:linear-gradient(90deg,#7be0ff,#a78bfa);-webkit-background-clip:text;background-clip:text;">玩法说明</div>
    <div class="subtitle" style="text-align:left;font-size:13px;color:#c8cad9;">
      • <b>移动</b>：电脑用 WASD / 方向键；手机用屏幕左下方虚拟摇杆<br><br>
      • <b>攻击</b>：全自动，武器会自动攻击附近的敌人<br><br>
      • <b>升级</b>：拾取敌人掉落的蓝色经验珠，升级时从 3 个强化中任选 1 个<br><br>
      • <b>生存</b>：怪物会越来越多、越来越强，每 60 秒出现一次 Boss<br><br>
      • <b>目标</b>：活得更久，击杀更多，挑战最高纪录！
    </div>
    <button class="btn" id="how-back">知道了</button>
  </div>
</div>

<!-- 升级选择 -->
<div id="levelup" class="overlay hidden">
  <div class="panel" id="levelup-panel">
    <div class="title">⭐ 升级！选择一项强化</div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<!-- 暂停 -->
<div id="paused" class="overlay hidden">
  <div class="panel">
    <div class="title" style="font-size:26px;background:linear-gradient(90deg,#fff,#9aa);-webkit-background-clip:text;background-clip:text;">已暂停</div>
    <button class="btn" id="resume-btn">继续游戏</button>
    <div class="row"><button class="btn ghost" id="quit-btn" style="font-size:13px;padding:9px 18px;">返回主菜单</button></div>
  </div>
</div>

<!-- 游戏结束 -->
<div id="gameover" class="overlay hidden">
  <div class="panel">
    <div class="title" style="font-size:28px;">你倒下了</div>
    <div class="subtitle">存活时间</div>
    <div class="big-num" id="final-time">00:00</div>
    <div class="subtitle" style="margin:4px 0 0;">击杀数 <b id="final-kills" style="color:#fff;font-size:18px;">0</b> ｜ 等级 <b id="final-level" style="color:#fff;font-size:18px;">1</b></div>
    <div id="newrecord" class="hint hidden" style="color:#ffd76a;font-size:14px;">🎉 新纪录！</div>
    <div class="row"><button class="btn" id="retry-btn">再来一局</button><button class="btn ghost" id="home-btn">主菜单</button></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
